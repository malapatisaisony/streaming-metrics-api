name: streaming-metrics

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.5
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
      - --default-log-level=info
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "-X", "brokers=localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  topic-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.5
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["rpk"]
    command:
      - topic
      - create
      - orders
      - --partitions=3
      - --replicas=1
      - --if-not-exists
      - -X
      - brokers=redpanda:9092

  postgres:
    image: postgres:17.11
    cpus: 1
    mem_limit: 512m
    environment:
      POSTGRES_DB: streaming_metrics
      POSTGRES_USER: metrics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - type: bind
        source: ./sql
        target: /docker-entrypoint-initdb.d
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "metrics", "-d", "streaming_metrics"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  spark:
    image: streaming-metrics-spark:dev
    build:
      context: .
      dockerfile: Dockerfile.spark
    cpus: 2
    mem_limit: 1536m
    depends_on:
      redpanda:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      SPARK_LOCAL_IP: "127.0.0.1"
      PYSPARK_PYTHON: python3
      TZ: UTC
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: streaming_metrics
      PGUSER: metrics
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - type: bind
        source: ./stream_processor.py
        target: /opt/spark/app/stream_processor.py
        read_only: true
        bind:
          create_host_path: false
      - spark_work:/opt/spark/work-dir
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --driver-memory
      - 512m
      - --conf
      - spark.jars.ivy=/opt/spark/work-dir/ivy
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.4
      - /opt/spark/app/stream_processor.py

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: streaming_metrics
      PGUSER: metrics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/metrics/minute?limit=1', timeout=5).close()"
      interval: 15s
      timeout: 6s
      retries: 6
      start_period: 10s

volumes:
  redpanda_data:
  spark_work:
  postgres_data: