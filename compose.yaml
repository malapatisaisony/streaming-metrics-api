name: streaming-metrics

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.5
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
      - --default-log-level=info
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "-X", "brokers=localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:17.11
    cpus: 1
    mem_limit: 512m
    environment:
      POSTGRES_DB: streaming_metrics
      POSTGRES_USER: metrics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - type: bind
        source: ./sql/001_create_metrics.sql
        target: /docker-entrypoint-initdb.d/001_create_metrics.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "metrics", "-d", "streaming_metrics"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  spark:
    image: apache/spark:4.0.4-python3
    cpus: 2
    mem_limit: 1536m
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      SPARK_LOCAL_IP: "127.0.0.1"
      PYSPARK_PYTHON: python3
    volumes:
      - type: bind
        source: ./stream_processor.py
        target: /opt/spark/app/stream_processor.py
        read_only: true
        bind:
          create_host_path: false
      - spark_work:/opt/spark/work-dir
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --driver-memory
      - 512m
      - --conf
      - spark.jars.ivy=/opt/spark/work-dir/ivy
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.4
      - /opt/spark/app/stream_processor.py

volumes:
  redpanda_data:
  spark_work:
  postgres_data: