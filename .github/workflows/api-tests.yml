name: API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install API dependencies
        run: python -m pip install -r requirements-api.txt

      - name: Run API tests
        run: python -m unittest discover -s tests -p test_metric_rules.py -v