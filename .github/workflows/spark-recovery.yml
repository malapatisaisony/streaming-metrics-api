name: Pipeline smoke tests

on: workflow_dispatch

permissions:
  contents: read

jobs:
  pipeline-smoke:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Spark restart recovery
            script: tests/smoke_recovery.py
          - name: Event time and currency grouping
            script: tests/smoke_event_time.py
          - name: Malformed orders
            script: tests/smoke_malformed_orders.py
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check Docker Compose
        run: docker compose version

      - name: Install producer dependency
        run: python -m pip install -r requirements.txt

      - name: Run smoke test
        env:
          PIPELINE_SMOKE_SCRIPT: ${{ matrix.script }}
        run: python "$PIPELINE_SMOKE_SCRIPT"